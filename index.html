<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Detection</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo-icon">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
            </div>
            <h1>AI Voice Detector</h1>
            <p class="subtitle">Analyze audio files or record voice to detect synthetic AI vs human speech</p>
        </header>

        <main class="card">
            <!-- File Upload Dropzone -->
            <div class="form-group">
                <label for="audioFile" class="file-dropzone" id="dropzone" tabindex="0">
                    <div class="dropzone-icon" id="dropzoneIcon">
                        <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                    </div>
                    <span class="file-label" id="fileLabel">Click or drag an audio file (WAV, MP3, AAC, FLAC)</span>
                    <div id="fileMeta" class="file-meta hidden">
                        <span class="file-name" id="fileName"></span>
                        <button type="button" id="clearFileBtn" class="btn-clear" title="Remove selected file">&times;</button>
                    </div>
                    <input type="file" id="audioFile" accept="*/*" class="file-input">
                </label>
            </div>

            <div class="divider"><span>OR</span></div>

            <!-- Microphone Recording Button -->
            <div class="form-group">
                <button id="recordBtn" type="button" class="btn-secondary">
                    <span id="recordDot" class="record-dot hidden"></span>
                    <svg id="micIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="22"/></svg>
                    <span id="recordBtnText">Record Voice</span>
                </button>
            </div>

            <!-- Language Dropdown -->
            <div class="form-group">
                <label for="languageSelect">Audio Language (Optional)</label>
                <select id="languageSelect" class="select-input">
                    <option value="English">English</option>
                    <option value="Tamil">Tamil</option>
                    <option value="Hindi">Hindi</option>
                    <option value="Malayalam">Malayalam</option>
                    <option value="Telugu">Telugu</option>
                </select>
            </div>

            <!-- Detect Voice Submit Button -->
            <button id="detectBtn" class="btn-primary" disabled>
                <span id="btnText">Detect Voice</span>
                <div id="btnSpinner" class="spinner hidden"></div>
            </button>

            <!-- Error Banner -->
            <div id="errorBanner" class="error-banner hidden">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
                <span id="errorText"></span>
            </div>

            <!-- Result Card -->
            <div id="resultContainer" class="result-container hidden">
                <div class="result-header">
                    <span class="result-title">Detection Result</span>
                    <span id="classificationBadge" class="badge">--</span>
                </div>
                
                <div class="metric-group">
                    <div class="metric-header">
                        <span>Confidence Score</span>
                        <span id="confidenceText" class="metric-value">0%</span>
                    </div>
                    <div class="progress-bar-bg">
                        <div id="confidenceBar" class="progress-bar-fill" style="width: 0%;"></div>
                    </div>
                </div>

                <div class="explanation-box">
                    <span class="explanation-label">Explanation</span>
                    <p id="explanationText" class="explanation-content">--</p>
                </div>
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
